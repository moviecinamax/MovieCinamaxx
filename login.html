<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign In — Movie Cinamax</title>
<style>body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(420px,100%);background:#11131a;border:1px solid #292d38;border-radius:22px;padding:32px;box-sizing:border-box;box-shadow:0 20px 70px #0008}.logo{font-size:28px;font-weight:800;margin-bottom:25px}.logo span{color:#e50914}label{display:block;margin:14px 0 7px;color:#bbb}input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid #333845;background:#08090d;color:#fff;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#e50914;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.back{display:block;text-align:center;color:#aaa;margin-top:18px;text-decoration:none}.status{min-height:20px;margin-top:14px;color:#ff7070}</style></head>
<body><div class="box"><div class="logo">Movie <span>Cinamax</span></div><h1>Sign In</h1><p style="color:#999">Sign in to your Movie Cinamax account.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign In</button></form><div id="status" class="status"></div><a class="back" href="index.html">← Back to Movie Cinamax</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const c=window.supabaseClient, form=document.getElementById('loginForm'), status=document.getElementById('status');
c.auth.getSession().then(({data})=>{if(data.session) location.replace('index.html')});
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Signing in…';const {error}=await c.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){status.textContent=error.message;return}location.replace('index.html')});
</script></body></html>
